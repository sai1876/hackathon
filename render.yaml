services:
  - type: web
    name: aegisgrid-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SIMULATION_SUPABASE_URL
        sync: false
      - key: SIMULATION_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_REFERENCE_ENABLED
        value: "false"
      - key: GOOGLE_WEATHER_ENABLED
        value: "false"
      - key: AEGIS_OPERATOR_TOKEN
        generateValue: true
